name = "folio"
pages_build_output_dir = "public"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Local + remote config for the D1 Cabinet database.
# After creating the database, run:
#   npx wrangler d1 create folio
# then copy its database_id below (or leave blank and set the binding
# via Dashboard → Settings → Bindings after deploy).
[[d1_databases]]
binding = "DB"
database_name = "folio"
database_id = "689a5b45-e3db-4964-9010-92f0b79595d0"

# R2 bucket for harvested + published PDFs (10 GB free tier — enqueue
# endpoint hard-caps the harvest queue at 9 GB).
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "folio-pdfs"

[vars]